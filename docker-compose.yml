services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ngao
      POSTGRES_USER: ngao
      POSTGRES_PASSWORD: ngao_dev_password
    ports:
      - "5434:5432"
    volumes:
      - ngao_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngao -d ngao"]
      interval: 5s
      timeout: 5s
      retries: 10
  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ngao_test
      POSTGRES_USER: ngao
      POSTGRES_PASSWORD: ngao_test_password
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngao -d ngao_test"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  ngao_db:
